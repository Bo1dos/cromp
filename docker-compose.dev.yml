# ═══════════════════════════════════════════════════════════════════════════════
# Файл больше не используется.
# ═══════════════════════════════════════════════════════════════════════════════
#
# Основной compose-файл теперь:            docker-compose.yml
# Dev-override (автоматический):           docker-compose.override.yml
# Переменные окружения:                    .env
# Пример переменных:                       .env.example
#
# Быстрый старт:
#   docker compose up              # dev-режим (с override)
#   docker compose up --build      # пересобрать образы и запустить
#
# Prod-like (без dev-инструментов):
#   docker compose -f docker-compose.yml up
#
# Быстрый dev-цикл (jar пересобран на хосте):
#   ./gradlew :backend:orchestrator:bootJar
#   docker compose restart app
# ═══════════════════════════════════════════════════════════════════════════════


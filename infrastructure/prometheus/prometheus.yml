global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Backend (Java / Spring Boot Actuator) ──────────────────────────────────
  - job_name: 'cromp-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'cron-as-a-service'
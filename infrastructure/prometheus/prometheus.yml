global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']  # если приложение запущено локально, вне Docker
        labels:
          application: 'cronasas-api'
  # Если приложение тоже будет в Docker, используйте имя сервиса, например 'api:8080'
databaseChangeLog:
  - changeSet:
      id: create-analytics-aggregate-table
      author: bo1dos
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS mv_job_execution_daily (
                job_id                  bigint    NOT NULL,
                organization_id         bigint    NOT NULL,
                day                     date      NOT NULL,
                total_executions        bigint    NOT NULL DEFAULT 0,
                succeeded               bigint    NOT NULL DEFAULT 0,
                failed                  bigint    NOT NULL DEFAULT 0,
                avg_attempt_duration_ms double precision,
                p50_duration_ms         double precision,
                p95_duration_ms         double precision,
                max_duration_ms         double precision,
                total_attempts          bigint    NOT NULL DEFAULT 0
              );
        - sql:
            sql: |
              CREATE UNIQUE INDEX IF NOT EXISTS idx_mv_job_exec_daily
                ON mv_job_execution_daily (job_id, day);
        - rollback:
            sql: |
              DROP TABLE IF EXISTS mv_job_execution_daily;

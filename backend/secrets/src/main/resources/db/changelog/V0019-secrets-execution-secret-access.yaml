databaseChangeLog:
  - changeSet:
      id: create-execution-secret-access-table
      author: bo1dos
      changes:
        - createTable:
            tableName: execution_secret_access
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: attempt_id, type: BIGINT, constraints: { nullable: false, references: execution_attempts(id), foreignKeyName: fk_execution_secret_access_attempt_id, deleteCascade: true } }
              - column: { name: secret_version_id, type: BIGINT, constraints: { nullable: false, references: secret_versions(id), foreignKeyName: fk_execution_secret_access_secret_version_id } }
              - column: { name: accessed_key, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: accessed_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
        - createIndex:
            indexName: idx_secret_access_attempt
            tableName: execution_secret_access
            columns:
              - column: { name: attempt_id }
        - createIndex:
            indexName: idx_secret_access_secret
            tableName: execution_secret_access
            columns:
              - column: { name: secret_version_id }

databaseChangeLog:
  - changeSet:
      id: create-secret-versions-table
      author: bo1dos
      changes:
        - createTable:
            tableName: secret_versions
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: secret_id, type: BIGINT, constraints: { nullable: false, references: secrets(id), foreignKeyName: fk_secret_versions_secret_id, deleteCascade: true } }
              - column: { name: version, type: INTEGER, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: value_cipher, type: BYTEA, constraints: { nullable: false } }
              - column: { name: key_id, type: VARCHAR(255) }
              - column: { name: is_active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_by, type: BIGINT, constraints: { references: users(id), foreignKeyName: fk_secret_versions_created_by } }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: deprecated_at, type: TIMESTAMPTZ }
        - addUniqueConstraint:
            tableName: secret_versions
            columnNames: secret_id, version
            constraintName: uk_secret_versions_secret_version
        - createIndex:
            indexName: idx_secret_versions_secret
            tableName: secret_versions
            columns:
              - column: { name: secret_id }
              - column: { name: is_active }
              - column: { name: created_at }

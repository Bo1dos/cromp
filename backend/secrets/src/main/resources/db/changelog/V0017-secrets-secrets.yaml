databaseChangeLog:
  - changeSet:
      id: create-secrets-table
      author: bo1dos
      changes:
        - createTable:
            tableName: secrets
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: secret_uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { nullable: false, unique: true } }
              - column: { name: organization_id, type: BIGINT, constraints: { nullable: false, references: organizations(id), foreignKeyName: fk_secrets_organization_id, deleteCascade: true } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: scope, type: secret_scope, defaultValue: JOB, constraints: { nullable: false } }
              - column: { name: description, type: TEXT }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: deleted_at, type: TIMESTAMPTZ }
        - createIndex:
            indexName: ux_secrets_org_name_not_deleted
            tableName: secrets
            unique: true
            columns:
              - column: { name: organization_id }
              - column: { name: name }
            where: deleted_at IS NULL
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE secrets ADD COLUMN is_deleted BOOLEAN GENERATED ALWAYS AS (deleted_at IS NOT NULL) STORED;
        - sql:
            splitStatements: false
            sql: |
              CREATE TRIGGER tr_secrets_updated BEFORE UPDATE ON secrets FOR EACH ROW EXECUTE FUNCTION fn_update_updated_at();

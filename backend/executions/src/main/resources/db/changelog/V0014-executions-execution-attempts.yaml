databaseChangeLog:
  - changeSet:
      id: create-execution-attempts-table
      author: bo1dos
      changes:
        - createTable:
            tableName: execution_attempts
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: attempt_uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { nullable: false, unique: true } }
              - column: { name: execution_id, type: BIGINT, constraints: { nullable: false, references: executions(id), foreignKeyName: fk_execution_attempts_execution_id, deleteCascade: true } }
              - column: { name: organization_id, type: BIGINT, constraints: { nullable: false, references: organizations(id), foreignKeyName: fk_execution_attempts_organization_id, deleteCascade: true } }
              - column: { name: attempt_number, type: INTEGER, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: status, type: attempt_status, defaultValue: PENDING, constraints: { nullable: false } }
              - column: { name: status_reason, type: TEXT }
              - column: { name: error_class, type: TEXT }
              - column: { name: scheduled_at, type: TIMESTAMPTZ }
              - column: { name: claimed_at, type: TIMESTAMPTZ }
              - column: { name: started_at, type: TIMESTAMPTZ }
              - column: { name: finished_at, type: TIMESTAMPTZ }
              - column: { name: duration_ms, type: INTEGER }
              - column: { name: executor_metadata, type: JSONB }
              - column: { name: idempotency_key, type: UUID }
              - column: { name: output_summary, type: JSONB }
              - column: { name: trace_id, type: UUID }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: execution_attempts
            columnNames: execution_id, attempt_number
            constraintName: uk_execution_attempts_execution_number
        - createIndex:
            indexName: idx_attempts_org_status_sched
            tableName: execution_attempts
            columns:
              - column:
                  name: organization_id
              - column:
                  name: status
              - column:
                  name: scheduled_at
            where: "status IN ('PENDING','DISPATCHED')"
        - createIndex:
            indexName: idx_attempts_execution
            tableName: execution_attempts
            columns:
              - column:
                  name: execution_id
        - createIndex:
            indexName: idx_attempts_status_updated
            tableName: execution_attempts
            columns:
              - column:
                  name: status
              - column:
                  name: updated_at
            where: "status IN ('DISPATCHED','RUNNING')"
        - sql:
            sql: |
              CREATE TRIGGER tr_execution_attempts_updated BEFORE UPDATE ON execution_attempts FOR EACH ROW EXECUTE FUNCTION fn_update_updated_at();
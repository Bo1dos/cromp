databaseChangeLog:
  - changeSet:
      id: create-executions-table
      author: bo1dos
      changes:
        - createTable:
            tableName: executions
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: exec_uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { nullable: false, unique: true } }
              - column: { name: organization_id, type: BIGINT, constraints: { nullable: false, references: organizations(id), foreignKeyName: fk_executions_organization_id, deleteCascade: true } }
              - column: { name: job_id, type: BIGINT, constraints: { nullable: false, references: jobs(id), foreignKeyName: fk_executions_job_id, deleteCascade: true } }
              - column: { name: job_version_id, type: BIGINT, constraints: { references: job_versions(id), foreignKeyName: fk_executions_job_version_id } }
              - column: { name: priority, type: INTEGER, defaultValueNumeric: 0 }
              - column: { name: source, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: triggered_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: scheduled_at, type: TIMESTAMPTZ }
              - column: { name: final_status, type: execution_status, defaultValue: CREATED, constraints: { nullable: false } }
              - column: { name: total_attempts, type: INTEGER, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: started_at, type: TIMESTAMPTZ }
              - column: { name: finished_at, type: TIMESTAMPTZ }
              - column: { name: correlation_id, type: UUID }
              - column: { name: execution_policy_snapshot, type: JSONB }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
        - sql:
            sql: |
              ALTER TABLE executions ADD CONSTRAINT ck_executions_source CHECK (source IN ('SCHEDULED','MANUAL','API'));
        - createIndex:
            indexName: idx_executions_org_job_created
            tableName: executions
            columns:
              - column:
                  name: organization_id
              - column:
                  name: job_id
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_executions_org_status_created
            tableName: executions
            columns:
              - column:
                  name: organization_id
              - column:
                  name: final_status
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_executions_correlation
            tableName: executions
            columns:
              - column:
                  name: correlation_id
        - createIndex:
            indexName: idx_executions_job_version
            tableName: executions
            columns:
              - column:
                  name: job_version_id
        - sql:
            sql: |
              CREATE TRIGGER tr_executions_updated BEFORE UPDATE ON executions FOR EACH ROW EXECUTE FUNCTION fn_update_updated_at();
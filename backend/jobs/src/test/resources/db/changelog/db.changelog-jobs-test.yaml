databaseChangeLog:
  - include:
      file: classpath:db/changelog/V0000-common-extensions.yaml
  - include:
      file: classpath:db/changelog/V0001-common-enums.yaml
  - include:
      file: classpath:db/changelog/V0002-common-functions.yaml
  - include:
      file: classpath:db/changelog/V0003-iam-organizations.yaml
  - include:
      file: classpath:db/changelog/V0004-iam-users.yaml
  - changeSet:
      id: create-jobs-table-test
      author: codex
      changes:
        - createTable:
            tableName: jobs
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: job_uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { nullable: false, unique: true } }
              - column: { name: organization_id, type: BIGINT, constraints: { nullable: false, references: organizations(id), foreignKeyName: fk_jobs_organization_id, deleteCascade: true } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: description, type: TEXT }
              - column: { name: status, type: job_status, defaultValue: ACTIVE, constraints: { nullable: false } }
              - column: { name: queue_name, type: VARCHAR(100), defaultValue: default, constraints: { nullable: false } }
              - column: { name: priority, type: INTEGER, defaultValueNumeric: 0 }
              - column: { name: created_by, type: BIGINT }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: deleted_at, type: TIMESTAMPTZ }
        - createIndex:
            indexName: ux_jobs_org_name_not_deleted
            tableName: jobs
            unique: true
            columns: [ organization_id, name ]
            where: deleted_at IS NULL
        - createIndex:
            indexName: idx_jobs_org_status
            tableName: jobs
            columns: [ organization_id, status ]
            where: deleted_at IS NULL
        - sql:
            sql: |
              ALTER TABLE jobs ADD COLUMN is_deleted BOOLEAN GENERATED ALWAYS AS (deleted_at IS NOT NULL) STORED;
        - sql:
            sql: |
              CREATE TRIGGER tr_jobs_updated BEFORE UPDATE ON jobs FOR EACH ROW EXECUTE FUNCTION fn_update_updated_at();
  - changeSet:
      id: create-job-versions-table-test
      author: codex
      changes:
        - createTable:
            tableName: job_versions
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: job_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: version, type: INTEGER, constraints: { nullable: false } }
              - column: { name: lock_version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: config, type: JSONB, constraints: { nullable: false } }
              - column: { name: target_url, type: TEXT }
              - column: { name: method, type: VARCHAR(10) }
              - column: { name: timeout_ms, type: INTEGER }
              - column: { name: retry_policy, type: JSONB }
              - column: { name: created_by, type: BIGINT }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: job_versions
            columnNames: job_id, version
            constraintName: uk_job_versions_job_version

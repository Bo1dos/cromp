iam:
  jwt:
    secret: ${JWT_SECRET:changeit-changeit-changeit-changeit}
    expiration-ms: 3600000

spring:
  application:
    name: cromp-orchestrator
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

cromp:
  orchestrator:
    scheduler:
      enabled: ${CROMP_SCHEDULER_ENABLED:true}
      fixed-delay-ms: ${CROMP_SCHEDULER_DELAY_MS:30000}
    executor:
      enabled: ${CROMP_EXECUTOR_ENABLED:true}
      fixed-delay-ms: ${CROMP_EXECUTOR_DELAY_MS:1000}
      organization-id: ${CROMP_EXECUTOR_ORGANIZATION_ID:1}
    agents:
      registration-token: ${CROMP_AGENT_REGISTRATION_TOKEN:local-dev-agent-token}

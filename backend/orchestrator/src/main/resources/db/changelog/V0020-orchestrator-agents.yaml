databaseChangeLog:
  - changeSet:
      id: create-agents-table
      author: bo1dos
      changes:
        - createTable:
            tableName: agents
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: agent_uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { nullable: false, unique: true } }
              - column: { name: organization_id, type: BIGINT, constraints: { nullable: false, references: organizations(id), foreignKeyName: fk_agents_organization_id, deleteCascade: true } }
              - column: { name: name, type: VARCHAR(255) }
              - column: { name: capabilities, type: JSONB, defaultValue: "[]" }
              - column: { name: last_heartbeat, type: TIMESTAMPTZ }
              - column: { name: status, type: VARCHAR(20), defaultValue: OFFLINE, constraints: { nullable: false } }
              - column: { name: current_load, type: INTEGER, defaultValueNumeric: 0 }
              - column: { name: max_concurrent, type: INTEGER, defaultValueNumeric: 10 }
              - column: { name: metadata, type: JSONB, defaultValue: "{}" }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
        - addCheckConstraint:
            tableName: agents
            constraintName: ck_agents_status
            condition: "status IN ('ONLINE','OFFLINE','STALE','DRAINING')"
        - createIndex:
            indexName: idx_agents_org_status
            tableName: agents
            columns:
              - column: { name: organization_id }
              - column: { name: status }
              - column: { name: last_heartbeat }
        - sql:
            splitStatements: false
            sql: |
              CREATE TRIGGER tr_agents_updated BEFORE UPDATE ON agents FOR EACH ROW EXECUTE FUNCTION fn_update_updated_at();

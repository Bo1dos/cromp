# ═══════════════════════════════════════════════════════════════════════════════
# Docker-профиль Spring Boot
# Активируется при SPRING_PROFILES_ACTIVE=docker
# ═══════════════════════════════════════════════════════════════════════════════

server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/cromp}
    username: ${DB_USER:cromp}
    password: ${DB_PASSWORD:cromp123}

  liquibase:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cromp: INFO

# ── IAM / JWT ────────────────────────────────────────────────────────────────
iam:
  jwt:
    secret: ${JWT_SECRET:changeit-changeit-changeit-changeit}
    expiration-ms: 3600000

# ── MinIO (S3-совместимое хранилище артефактов) ─────────────────────────────
cromp:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: executions
    download-url-expiry-seconds: 3600

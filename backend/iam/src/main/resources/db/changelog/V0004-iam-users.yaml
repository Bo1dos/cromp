databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: bo1dos
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: user_uuid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { nullable: false, unique: true } }
              - column: { name: email, type: CITEXT, constraints: { nullable: false} }
              - column: { name: last_name, type: VARCHAR(150) }
              - column: { name: first_name, type: VARCHAR(150) }
              - column: { name: middle_name, type: VARCHAR(150) }
              - column: { name: display_name, type: VARCHAR(255) }
              - column: { name: password_hash, type: TEXT }
              - column: { name: profile, type: JSONB, defaultValue: "{}" }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: deleted_at, type: TIMESTAMPTZ }
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE users ADD COLUMN is_deleted BOOLEAN GENERATED ALWAYS AS (deleted_at IS NOT NULL) STORED;
        - sql:
            splitStatements: false
            sql: |
              CREATE UNIQUE INDEX ux_users_email_not_deleted ON users (email) WHERE deleted_at IS NULL;
        - sql:
            splitStatements: false
            sql: |
              CREATE TRIGGER tr_users_updated BEFORE UPDATE ON users FOR EACH ROW EXECUTE FUNCTION fn_update_updated_at();

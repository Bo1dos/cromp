databaseChangeLog:
  - changeSet:
      id: create-memberships-table
      author: bo1dos
      changes:
        - createTable:
            tableName: memberships
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false, references: users(id), foreignKeyName: fk_membership_user, deleteCascade: true } }
              - column: { name: organization_id, type: BIGINT, constraints: { nullable: false, references: organizations(id), foreignKeyName: fk_membership_org, deleteCascade: true } }
              - column: { name: role_id, type: BIGINT, constraints: { nullable: false, references: roles(id), foreignKeyName: fk_membership_role } }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: deleted_at, type: TIMESTAMPTZ}
        - addUniqueConstraint:
            constraintName: ux_memberships_user_org
            tableName: memberships
            columnNames: user_id, organization_id
        - createIndex:
            indexName: idx_memberships_org
            tableName: memberships
            columns:
              - column:
                  name: organization_id
        - sql:
            sql: |
              CREATE TRIGGER tr_memberships_updated BEFORE UPDATE ON memberships FOR EACH ROW EXECUTE FUNCTION fn_update_updated_at();
        - sql:
            sql: |
              ALTER TABLE memberships
                ADD COLUMN is_deleted BOOLEAN GENERATED ALWAYS AS (deleted_at IS NOT NULL) STORED;
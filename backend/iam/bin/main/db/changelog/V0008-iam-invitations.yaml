databaseChangeLog:
  - changeSet:
      id: create-invitations-table
      author: bo1dos
      changes:
        - createTable:
            tableName: invitations
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: organization_id, type: BIGINT, constraints: { nullable: false, references: organizations(id), foreignKeyName: fk_invitation_org, deleteCascade: true } }
              - column: { name: email, type: CITEXT, constraints: { nullable: false } }
              - column: { name: token_hash, type: TEXT, constraints: { nullable: false } }
              - column: { name: role_id, type: BIGINT, constraints: { nullable: false, references: roles(id), foreignKeyName: fk_invitation_role } }
              - column: { name: invited_by, type: BIGINT, constraints: { references: users(id), foreignKeyName: fk_invitation_inviter } }
              - column: { name: expires_at, type: TIMESTAMPTZ, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: accepted_at, type: TIMESTAMPTZ }
              - column: { name: status, type: invitation_status, defaultValue: PENDING, constraints: { nullable: false } }
        - createIndex:
            indexName: idx_invitations_token
            tableName: invitations
            columns: [ token_hash ]
        - createIndex:
            indexName: idx_invitations_org
            tableName: invitations
            columns: [ organization_id, status ]
databaseChangeLog:
  - changeSet:
      id: create-update-timestamp-function
      author: bo1dos
      changes:
        - sql:
            sql: |
              CREATE OR REPLACE FUNCTION fn_update_updated_at()
              RETURNS TRIGGER AS $$
              BEGIN
                NEW.updated_at = NOW();
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
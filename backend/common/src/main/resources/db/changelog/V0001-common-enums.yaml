databaseChangeLog:
  - changeSet:
      id: create-common-enums
      author: bo1dos
      changes:
        - sql:
            splitStatements: false
            sql: DO $$ BEGIN CREATE TYPE user_role AS ENUM ('OWNER', 'ADMIN', 'DEVELOPER', 'VIEWER'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;
        - sql:
            splitStatements: false
            sql: DO $$ BEGIN CREATE TYPE job_status AS ENUM ('ACTIVE', 'DISABLED', 'ARCHIVED'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;
        - sql:
            splitStatements: false
            sql: DO $$ BEGIN CREATE TYPE schedule_status AS ENUM ('ACTIVE', 'PAUSED'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;
        - sql:
            splitStatements: false
            sql: DO $$ BEGIN CREATE TYPE execution_status AS ENUM ('CREATED', 'IN_PROGRESS', 'SUCCEEDED', 'FAILED', 'CANCELLED', 'SKIPPED'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;
        - sql:
            splitStatements: false
            sql: DO $$ BEGIN CREATE TYPE attempt_status AS ENUM ('PENDING', 'DISPATCHED', 'RUNNING', 'SUCCEEDED', 'FAILED', 'TIMEOUT', 'CANCELLED', 'RETRYING'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;

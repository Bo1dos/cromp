            splitStatements: false
            sql: DO $$ BEGIN CREATE TYPE artifact_kind AS ENUM ('LOG_STDOUT', 'LOG_STDERR', 'OUTPUT_PAYLOAD', 'DEBUG_SNAPSHOT'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;
        - sql:
            splitStatements: false
            sql: DO $$ BEGIN CREATE TYPE invitation_status AS ENUM ('PENDING', 'ACCEPTED', 'EXPIRED', 'REVOKED'); EXCEPTION WHEN duplicate_object THEN NULL; END $$;
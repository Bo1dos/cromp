databaseChangeLog:
  - changeSet:
      id: create-common-enums
      author: bo1dos
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'user_role') THEN
                  CREATE TYPE user_role AS ENUM ('OWNER', 'ADMIN', 'DEVELOPER', 'VIEWER');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'job_status') THEN
                  CREATE TYPE job_status AS ENUM ('ACTIVE', 'DISABLED', 'ARCHIVED');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'schedule_status') THEN
                  CREATE TYPE schedule_status AS ENUM ('ACTIVE', 'PAUSED');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'execution_status') THEN
                  CREATE TYPE execution_status AS ENUM ('CREATED', 'IN_PROGRESS', 'SUCCEEDED', 'FAILED', 'CANCELLED', 'SKIPPED');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'attempt_status') THEN
                  CREATE TYPE attempt_status AS ENUM ('PENDING', 'DISPATCHED', 'RUNNING', 'SUCCEEDED', 'FAILED', 'TIMEOUT', 'CANCELLED', 'RETRYING');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'secret_scope') THEN
                  CREATE TYPE secret_scope AS ENUM ('JOB', 'ORGANIZATION', 'GLOBAL');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'artifact_kind') THEN
                  CREATE TYPE artifact_kind AS ENUM ('LOG_STDOUT', 'LOG_STDERR', 'OUTPUT_PAYLOAD', 'DEBUG_SNAPSHOT');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'invitation_status') THEN
                  CREATE TYPE invitation_status AS ENUM ('PENDING', 'ACCEPTED', 'EXPIRED', 'REVOKED');
                END IF;
              END $$;

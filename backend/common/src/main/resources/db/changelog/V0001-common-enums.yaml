databaseChangeLog:
  - changeSet:
      id: create-common-enums
      author: bo1dos
      changes:
        - createType:
            typeName: user_role
            enumValues: OWNER, ADMIN, DEVELOPER, VIEWER
        - createType:
            typeName: job_status
            enumValues: ACTIVE, DISABLED, ARCHIVED
        - createType:
            typeName: schedule_status
            enumValues: ACTIVE, PAUSED
        - createType:
            typeName: execution_status
            enumValues: CREATED, IN_PROGRESS, SUCCEEDED, FAILED, CANCELLED, SKIPPED
        - createType:
            typeName: attempt_status
            enumValues: PENDING, DISPATCHED, RUNNING, SUCCEEDED, FAILED, TIMEOUT, CANCELLED, RETRYING
        - createType:
            typeName: secret_scope
            enumValues: JOB, ORGANIZATION, GLOBAL
        - createType:
            typeName: artifact_kind
            enumValues: LOG_STDOUT, LOG_STDERR, OUTPUT_PAYLOAD, DEBUG_SNAPSHOT
        - createType:
            typeName: invitation_status
            enumValues: PENDING, ACCEPTED, EXPIRED, REVOKED
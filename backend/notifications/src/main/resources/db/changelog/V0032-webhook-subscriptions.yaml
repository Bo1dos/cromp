databaseChangeLog:
  - changeSet:
      id: V0032-create-webhook-subscriptions
      author: cromp
      changes:
        - createTable:
            tableName: webhook_subscriptions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: subscription_uuid
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: organization_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: secret
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValue: true
                  constraints:
                    nullable: false
              - column:
                  name: event_types
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - createIndex:
            tableName: webhook_subscriptions
            indexName: idx_webhook_subs_org
            columns:
              - column:
                  name: organization_id

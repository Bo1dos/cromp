databaseChangeLog:
  - changeSet:
      id: V0031-create-notification-preferences
      author: cromp
      changes:
        - createTable:
            tableName: notification_preferences
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: channels
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: event_types
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - createIndex:
            tableName: notification_preferences
            indexName: idx_notif_prefs_user_id
            columns:
              - column:
                  name: user_id
            unique: true

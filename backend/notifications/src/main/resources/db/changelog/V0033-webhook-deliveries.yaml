databaseChangeLog:
  - changeSet:
      id: V0033-create-webhook-deliveries
      author: cromp
      changes:
        - createTable:
            tableName: webhook_deliveries
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: subscription_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: notification_uuid
                  type: UUID
              - column:
                  name: request_url
                  type: VARCHAR(500)
              - column:
                  name: response_code
                  type: INT
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: 'PENDING'
              - column:
                  name: attempt_number
                  type: INT
                  defaultValue: 1
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: attempted_at
                  type: TIMESTAMPTZ
              - column:
                  name: next_retry_at
                  type: TIMESTAMPTZ
        - createIndex:
            tableName: webhook_deliveries
            indexName: idx_webhook_del_subscription
            columns:
              - column:
                  name: subscription_id
        - createIndex:
            tableName: webhook_deliveries
            indexName: idx_webhook_del_retry
            columns:
              - column:
                  name: status
              - column:
                  name: next_retry_at
